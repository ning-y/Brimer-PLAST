name: Build tnBLAST

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-13
            label: macOS Intel (x86_64)
          - os: macos-14
            label: macOS Apple Silicon (arm64)
          - os: windows-latest
            label: Windows (x86_64)

    runs-on: ${{ matrix.os }}
    name: Build tnBLAST on ${{ matrix.label }}

    defaults:
      run:
        # Use bash on all runners, including Windows
        shell: bash

    steps:
      - name: Download tnBLAST source (v2.77)
        run: |
          curl -sL -o tnblast.tar.gz \
            https://github.com/jgans/thermonucleotideBLAST/archive/refs/tags/v2.77.tar.gz
          mkdir tnblast-src
          tar xzf tnblast.tar.gz -C tnblast-src --strip-components=1

      # ── macOS build ─────────────────────────────────────────────
      - name: Compile tnBLAST (macOS)
        if: runner.os == 'macOS'
        run: |
          cd tnblast-src
          make \
            CC=clang++ \
            FLAGS="-O3 -Wall -std=c++14" \
            LIBS="-lm -lz" \
            OPENMP= \
            -j$(sysctl -n hw.logicalcpu)

      # ── Windows build (MSYS2 / MinGW) ───────────────────────────
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-make

      - name: Patch source for MinGW (remove custom min() ambiguous with std::min)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd tnblast-src
          # Remove legacy min/max templates meant for MSVC < 6.0.
          # They conflict with std::min/std::max on modern GCC/MinGW.
          sed -i '/^template <class A>$/,/^}$/d' nuc_cruc.h

      - name: Compile tnBLAST (Windows via MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd tnblast-src
          mingw32-make \
            CC=g++ \
            FLAGS="-O3 -Wall -std=c++14 -include stdint.h" \
            LIBS="-lm -lz" \
            OPENMP=

      # ── Verification ───────────────────────────────────────────
      - name: Check binary exists
        run: |
          FILE=
          for f in tnblast-src/tntblast.exe tnblast-src/tntblast; do
            if [ -f "$f" ]; then
              FILE="$f"
              break
            fi
          done
          if [ -z "$FILE" ]; then
            echo "FAIL: No tnBLAST binary found"
            ls tnblast-src/
            exit 1
          fi
          echo "OK: Found $FILE"
          echo "BINARY_PATH=$FILE" >> "$GITHUB_ENV"

      - name: Show file type (macOS only)
        if: runner.os == 'macOS'
        run: file -b "$BINARY_PATH"

      # Smoke test validates the binary works, so no separate version check needed
      - name: Smoke test on tiny FASTA
        run: |
          printf '>chr1\nACGTACGTACGTACGTACGTACGTACGTACGT\n' > /tmp/test.fa
          printf 'test_pair\tACGTACGTACGTACGTACGT\tACGTACGTACGTACGTACGT\n' > /tmp/test.assay
          "$BINARY_PATH" -i /tmp/test.assay -d /tmp/test.fa -o /tmp/test.out \
            -l 100 -e 55 -x 65
          echo "==== tnBLAST output ===="
          cat /tmp/test.out
          echo "========================"
          if grep -q 'amplicon' /tmp/test.out; then
            echo "OK: Smoke test passed"
          else
            echo "WARN: No amplicon found (may be expected for this tiny input)"
          fi

      # ── Upload ─────────────────────────────────────────────────
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tntblast-${{ runner.os }}
          path: tnblast-src/tntblast*
          if-no-files-found: error