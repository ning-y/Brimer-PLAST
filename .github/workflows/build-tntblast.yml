name: Build tnBLAST

# ────────────────────────────────────────────────────────────────────
# Phase 0 — Cross-compile tnBLAST for macOS (Intel + ARM) and Windows.
# Run on every push to main, or manually from the GitHub web UI.
# ────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you trigger from github.com with one click

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-13
            label: macOS Intel (x86_64)
          - os: macos-14
            label: macOS Apple Silicon (arm64)
          - os: windows-latest
            label: Windows (x86_64)

    runs-on: ${{ matrix.os }}
    # A human-readable name on the GitHub Actions page
    name: Build tnBLAST on ${{ matrix.label }}

    steps:
      # ── Download tnBLAST source ─────────────────────────────────
      - name: Download tnBLAST source (v2.77)
        run: |
          curl -sL -o tnblast.tar.gz \
            https://github.com/jgans/thermonucleotideBLAST/archive/refs/tags/v2.77.tar.gz
          mkdir tnblast-src
          tar xzf tnblast.tar.gz -C tnblast-src --strip-components=1

      # ── macOS build ─────────────────────────────────────────────
      - name: Compile tnBLAST (macOS)
        if: runner.os == 'macOS'
        run: |
          cd tnblast-src
          make \
            CC=clang++ \
            FLAGS="-O3 -Wall -std=c++14" \
            LIBS="-lm -lz" \
            -j$(sysctl -n hw.logicalcpu)

      # ── Windows build (MSYS2 / MinGW) ───────────────────────────
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib

      - name: Compile tnBLAST (Windows via MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd tnblast-src
          mingw32-make \
            CC=g++ \
            FLAGS="-O3 -Wall -std=c++14" \
            LIBS="-lm -lz"

      # ── Veriﬁcation ─────────────────────────────────────────────
      - name: Check binary exists and is executable
        run: |
          FILE=$(ls tnblast-src/tntblast* 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "❌ No tnBLAST binary found in tnblast-src/"
            exit 1
          fi
          echo "✅ Found binary: $FILE"
          echo "BINARY_PATH=$FILE" >> "$GITHUB_ENV"

      - name: Show file type (macOS)
        if: runner.os == 'macOS'
        run: file -b "$BINARY_PATH"

      - name: Print --help
        run: "$BINARY_PATH" --help 2>&1 | head -8

      - name: Smoke test — run tnBLAST on a tiny FASTA
        run: |
          cd tnblast-src
          # Create a 32 bp "genome"
          printf '>chr1\nACGTACGTACGTACGTACGTACGTACGTACGT\n' > /tmp/test.fa
          # Create one primer pair
          printf 'test_pair\tACGTACGTACGTACGTACGT\tACGTACGTACGTACGTACGT\n' > /tmp/test.assay
          # Search for amplicons
          ./tntblast* -i /tmp/test.assay -d /tmp/test.fa -o /tmp/test.out \
            -l 100 -e 55 -x 65
          echo "──── tnBLAST output ────"
          cat /tmp/test.out
          echo "───────────────────────"
          if grep -q 'amplicon range' /tmp/test.out; then
            echo "✅ Smoke test passed — amplicon found"
          else
            echo "⚠️  No amplicon found (this may be expected for this tiny test)"
          fi

      # ── Upload artifact ──────────────────────────────────────────
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tntblast-${{ runner.os }}
          path: tnblast-src/tntblast*
          if-no-files-found: error