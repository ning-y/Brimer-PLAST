name: Build desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            label: macOS ARM
            builder-flag: --mac --arm64
            artifact-glob: '*.dmg'
            sidecar-name: pybrimer
          - os: windows-latest
            label: Windows
            builder-flag: --win
            artifact-glob: '*.exe'
            sidecar-name: pybrimer.exe
          - os: ubuntu-24.04
            label: Linux
            builder-flag: --linux AppImage
            artifact-glob: '*.AppImage'
            sidecar-name: pybrimer

    runs-on: ${{ matrix.os }}
    name: Build — ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v6

      # ── 1. Compile tnBLAST ──────────────────────────────────
      - name: Download tnBLAST source
        shell: bash
        run: |
          curl -sL -o tnblast.tar.gz \
            https://github.com/jgans/thermonucleotideBLAST/archive/refs/tags/v2.77.tar.gz
          mkdir tnblast-src
          tar xzf tnblast.tar.gz -C tnblast-src --strip-components=1

      - name: Compile tnBLAST (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd tnblast-src
          make \
            CC=clang++ \
            FLAGS="-O3 -Wall -std=c++14" \
            LIBS="-lm -lz" \
            OPENMP= \
            -j$(sysctl -n hw.logicalcpu)

      - name: Compile tnBLAST (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd tnblast-src
          make \
            CC=g++ \
            FLAGS="-O3 -Wall -fopenmp -std=c++14" \
            LIBS="-lm -lz" \
            OPENMP=-fopenmp \
            -j$(nproc)

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-make

      - name: Patch source for MinGW
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd tnblast-src
          sed -i '/^template <class A>$/,/^}$/d' nuc_cruc.h

      - name: Compile tnBLAST (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd tnblast-src
          mingw32-make \
            CC=g++ \
            FLAGS="-O3 -Wall -std=c++14 -include stdint.h" \
            LIBS="-lm -lz" \
            OPENMP=

      - name: Verify tnBLAST binary
        shell: bash
        run: |
          for f in tnblast-src/tntblast.exe tnblast-src/tntblast; do
            if [ -f "$f" ]; then echo "OK: found $f"; exit 0; fi
          done
          echo "FAIL: no tnBLAST binary found"
          ls tnblast-src/
          exit 1

      # ── 2. PyInstaller bundle ───────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install primer3-py pyinstaller -q
          pip install -e . -q

      - name: Build PyInstaller bundle
        shell: bash
        run: |
          TNT=$(ls tnblast-src/tntblast* | head -1)
          pyinstaller \
            --onefile \
            --name pybrimer \
            --collect-all primer3 \
            --add-binary "$TNT:." \
            sidecar.py

      - name: Copy tnBLAST to dist/ for Electron resources
        shell: bash
        run: cp tnblast-src/tntblast* dist/

      - name: Verify PyInstaller bundle
        shell: bash
        run: ls -lh dist/pybrimer*

      # ── 3. Electron installer ───────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Linux dependencies (AppImage)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfuse2

      - name: Validate sidecar exists
        shell: bash
        run: |
          if [ ! -f "dist/${{ matrix.sidecar-name }}" ]; then
            echo "Expected sidecar dist/${{ matrix.sidecar-name }} not found!"
            ls -R dist/
            exit 1
          fi

      - name: Ensure sidecar is executable
        shell: bash
        run: chmod +x "dist/${{ matrix.sidecar-name }}"

      - name: Validate JS/HTML syntax
        shell: bash
        run: |
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/renderer/renderer.js
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('electron/renderer/index.html', 'utf8');
            const m = html.match(/<script>([\s\S]*?)<\/script>/g);
            if (!m || m.length === 0) { console.log('No inline <script> (OK — scripts are external)'); }
            console.log('HTML syntax OK');
          "

      - name: Install npm dependencies
        run: npm install
        working-directory: electron

      - name: Build Electron installer
        run: npx electron-builder ${{ matrix.builder-flag }}
        working-directory: electron

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: brimer-plast-${{ matrix.label }}
          path: electron/dist/${{ matrix.artifact-glob }}
          if-no-files-found: error
