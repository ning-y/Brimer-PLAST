<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brimer-PLAST</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 20px; background: #f5f5f5; color: #222;
  }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 1.4em; margin: 0 0 16px 0; color: #333; }
  label { font-weight: 600; font-size: 0.85em; display: block; margin-top: 12px; color: #444; }

  /* File picker rows */
  .file-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .file-row button {
    white-space: nowrap; padding: 6px 16px; font-size: 0.85em;
    background: #fff; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;
  }
  .file-row button:hover { background: #eee; }
  .file-row .path {
    font-size: 0.82em; color: #666; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 1;
  }

  textarea, input[type="text"], input[type="number"] {
    width: 100%; padding: 6px 8px; font-size: 0.9em;
    border: 1px solid #ccc; border-radius: 4px;
  }
  textarea { font-family: inherit; }

  details { margin-top: 12px; }
  details summary { cursor: pointer; font-weight: 600; font-size: 0.85em; color: #444; }
  .params-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-top: 8px;
  }
  .params-grid label { margin: 0; font-weight: normal; font-size: 0.8em; }
  .params-grid input { width: 100%; }

  .run-row { margin-top: 16px; }
  .run-row button {
    padding: 8px 32px; font-size: 1em; font-weight: 600;
    background: #2a7de1; color: #fff; border: none; border-radius: 4px; cursor: pointer;
  }
  .run-row button:hover { background: #1a6bc9; }
  .run-row button:disabled { background: #999; cursor: not-allowed; }

  /* Progress */
  #progress-area { margin-top: 16px; display: none; }
  #progress-bar {
    width: 100%; height: 6px; appearance: none; border: none; border-radius: 3px;
  }
  #progress-text { font-size: 0.85em; color: #555; margin-top: 4px; }

  /* Results */
  #results-area { margin-top: 16px; display: none; }
  #results-area h2 { font-size: 1em; margin: 0 0 8px 0; }
  table {
    width: 100%; border-collapse: collapse; font-size: 0.78em;
  }
  th, td {
    border: 1px solid #ddd; padding: 4px 6px; text-align: left; white-space: nowrap;
  }
  th {
    background: #e8e8e8; font-weight: 600; cursor: pointer; user-select: none;
  }
  th:hover { background: #ddd; }
  td.seq { font-family: "SF Mono", "Fira Code", Consolas, monospace; font-size: 0.85em; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .num { text-align: right; }
  #open-pdf-btn {
    margin-top: 8px; padding: 6px 16px; font-size: 0.85em;
    background: #fff; border: 1px solid #2a7de1; border-radius: 4px; color: #2a7de1; cursor: pointer;
  }
  #open-pdf-btn:hover { background: #eef4fd; }

  /* Error */
  #error-area { margin-top: 12px; padding: 10px; background: #fff0f0; border: 1px solid #ecc; border-radius: 4px; color: #b22; font-size: 0.85em; display: none; }

  .warnings { color: #a67c00; font-size: 0.82em; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <h1>Brimer-PLAST</h1>

  <!-- File pickers -->
  <label for="genome-btn">Genome FASTA</label>
  <div class="file-row">
    <button id="genome-btn">Browse…</button>
    <span class="path" id="genome-path">No file selected</span>
  </div>

  <label for="gtf-btn">GTF Annotation</label>
  <div class="file-row">
    <button id="gtf-btn">Browse…</button>
    <span class="path" id="gtf-path">No file selected</span>
  </div>

  <!-- Target genes -->
  <label for="targets">Target gene(s) — one per line</label>
  <textarea id="targets" rows="3" placeholder="GAPDH&#10;ACTB"></textarea>

  <!-- Advanced params -->
  <details>
    <summary>Primer parameters (optional)</summary>
    <div class="params-grid">
      <label>Product min <input type="number" id="product-min" value="80"></label>
      <label>Product max <input type="number" id="product-max" value="200"></label>
      <label>Opt Tm (°C) <input type="number" id="opt-tm" value="60" step="0.1"></label>
      <label>Min Tm (°C) <input type="number" id="min-tm" value="57" step="0.1"></label>
      <label>Max Tm (°C) <input type="number" id="max-tm" value="63" step="0.1"></label>
      <label>Opt primer length <input type="number" id="opt-size" value="20"></label>
      <label>Min primer length <input type="number" id="min-size" value="18"></label>
      <label>Max primer length <input type="number" id="max-size" value="25"></label>
      <label>Min GC% <input type="number" id="min-gc" value="40"></label>
      <label>Max GC% <input type="number" id="max-gc" value="60"></label>
      <label>Pairs per chain <input type="number" id="num-return" value="50"></label>
      <label>Max amplicon (bp) <input type="number" id="max-amplicon" value="2000"></label>
    </div>
  </details>

  <!-- Run -->
  <div class="run-row">
    <button id="run-btn">Run</button>
  </div>

  <!-- Progress -->
  <div id="progress-area">
    <progress id="progress-bar"></progress>
    <div id="progress-text"></div>
  </div>

  <!-- Error -->
  <div id="error-area"></div>

  <!-- Results -->
  <div id="results-area">
    <h2 id="results-title"></h2>
    <div id="warnings-area" class="warnings"></div>
    <table>
      <thead><tr>
        <th data-col="pair_name">Name</th>
        <th data-col="forward_seq">Forward (5'→3')</th>
        <th data-col="reverse_seq">Reverse (5'→3')</th>
        <th data-col="forward_tm" class="num">Tm (°C)</th>
        <th data-col="forward_gc" class="num">GC%</th>
        <th data-col="product_size" class="num">Size</th>
      </tr></thead>
      <tbody id="pairs-body"></tbody>
    </table>
    <button id="open-pdf-btn" style="display:none">Open PDF report</button>
  </div>
</div>

<script>
  (function () {
    'use strict';

    // ── State ─────────────────────────────────────────────────
    let genomePath = null;
    let gtfPath = null;
    let currentPdfPath = null;
    let running = false;

    // ── DOM refs ──────────────────────────────────────────────
    const genomeBtn = document.getElementById('genome-btn');
    const genomePathEl = document.getElementById('genome-path');
    const gtfBtn = document.getElementById('gtf-btn');
    const gtfPathEl = document.getElementById('gtf-path');
    const targetsEl = document.getElementById('targets');
    const runBtn = document.getElementById('run-btn');
    const progressArea = document.getElementById('progress-area');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const errorArea = document.getElementById('error-area');
    const resultsArea = document.getElementById('results-area');
    const resultsTitle = document.getElementById('results-title');
    const warningsArea = document.getElementById('warnings-area');
    const pairsBody = document.getElementById('pairs-body');
    const openPdfBtn = document.getElementById('open-pdf-btn');

    // ── File pickers ─────────────────────────────────────────
    genomeBtn.addEventListener('click', async () => {
      const path = await window.api.selectFasta();
      if (path) { genomePath = path; genomePathEl.textContent = path; }
    });

    gtfBtn.addEventListener('click', async () => {
      const path = await window.api.selectGtf();
      if (path) { gtfPath = path; gtfPathEl.textContent = path; }
    });

    // ── Progress & error listeners ────────────────────────────
    window.api.onProgress((data) => {
      progressBar.value = data.pct || 0;
      progressText.textContent = data.message || '';
    });

    window.api.onError((msg) => {
      running = false;
      runBtn.disabled = false;
      progressArea.style.display = 'none';
      showError(msg);
    });

    // ── Helpers ───────────────────────────────────────────────
    function showError(msg) {
      errorArea.textContent = msg;
      errorArea.style.display = 'block';
    }

    function clearError() {
      errorArea.style.display = 'none';
      errorArea.textContent = '';
    }

    function getParam(id) {
      const el = document.getElementById(id);
      const val = parseFloat(el.value);
      return isNaN(val) ? undefined : val;
    }

    // ── Table sorting ─────────────────────────────────────────
    let sortCol = null;
    let sortAsc = true;

    function renderPairs(pairs) {
      // Sort if a column is selected
      let sorted = [...pairs];
      if (sortCol) {
        sorted.sort((a, b) => {
          const va = a[sortCol], vb = b[sortCol];
          if (typeof va === 'number' && typeof vb === 'number') {
            return sortAsc ? va - vb : vb - va;
          }
          const sa = String(va || ''), sb = String(vb || '');
          return sortAsc ? sa.localeCompare(sb) : sb.localeCompare(sa);
        });
      }

      pairsBody.innerHTML = '';
      for (const p of sorted) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${esc(p.pair_name || '')}</td>
          <td class="seq">${esc(p.forward_seq || '')}</td>
          <td class="seq">${esc(p.reverse_seq || '')}</td>
          <td class="num">${fmt(p.forward_tm)}</td>
          <td class="num">${fmt(p.forward_gc)}</td>
          <td class="num">${fmt(p.product_size)}</td>
        `;
        pairsBody.appendChild(tr);
      }
    }

    function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function fmt(v) { return v == null ? '–' : typeof v === 'number' ? v.toFixed(1) : v; }

    // Click on table header to sort
    document.querySelector('thead').addEventListener('click', (e) => {
      const th = e.target.closest('th');
      if (!th) return;
      const col = th.dataset.col;
      if (!col) return;
      if (sortCol === col) { sortAsc = !sortAsc; } else { sortCol = col; sortAsc = true; }
      // Re-render the last set of pairs
      if (window._lastPairs) renderPairs(window._lastPairs);
    });

    // ── Run pipeline ──────────────────────────────────────────
    runBtn.addEventListener('click', async () => {
      // Validate
      if (!genomePath) { showError('Please select a genome FASTA file.'); return; }
      if (!gtfPath) { showError('Please select a GTF annotation file.'); return; }
      const targets = targetsEl.value.split('\n').map(s => s.trim()).filter(Boolean);
      if (targets.length === 0) { showError('Please enter at least one target gene.'); return; }

      clearError();
      resultsArea.style.display = 'none';
      currentPdfPath = null;

      const primerArgs = {
        PRIMER_NUM_RETURN: getParam('num-return') || 50,
        PRIMER_PRODUCT_SIZE_RANGE: `${getParam('product-min') || 80}-${getParam('product-max') || 200}`,
        PRIMER_OPT_TM: getParam('opt-tm') || 60,
        PRIMER_MIN_TM: getParam('min-tm') || 57,
        PRIMER_MAX_TM: getParam('max-tm') || 63,
        PRIMER_OPT_SIZE: getParam('opt-size') || 20,
        PRIMER_MIN_SIZE: getParam('min-size') || 18,
        PRIMER_MAX_SIZE: getParam('max-size') || 25,
        PRIMER_MIN_GC: getParam('min-gc') || 40,
        PRIMER_MAX_GC: getParam('max-gc') || 60,
      };
      const maxAmplicon = getParam('max-amplicon') || 2000;

      running = true;
      runBtn.disabled = true;
      progressArea.style.display = 'block';
      progressBar.removeAttribute('value'); // indeterminate
      progressText.textContent = 'Starting…';

      for (let i = 0; i < targets.length; i++) {
        const target = targets[i];
        progressText.textContent = `[${i+1}/${targets.length}] ${target} — starting…`;

        try {
          const result = await window.api.runPipeline({
            genome: genomePath,
            annotations: gtfPath,
            target_key: target,
            target_type: 'gene',
            primer_args: primerArgs,
            max_amplicon: maxAmplicon,
            pdf_output_dir: null, // main.js will inject app data dir
          });

          // Show results for this target
          resultsTitle.textContent = `Target: ${target} — ${result.filtered_pairs.length} primer pair(s)`;
          if (result.warnings && result.warnings.length > 0) {
            warningsArea.textContent = result.warnings.join('\n');
            warningsArea.style.display = 'block';
          } else {
            warningsArea.style.display = 'none';
          }

          window._lastPairs = result.filtered_pairs;
          renderPairs(result.filtered_pairs);

          if (result.pdf_path) {
            currentPdfPath = result.pdf_path;
            openPdfBtn.style.display = 'inline-block';
          } else {
            openPdfBtn.style.display = 'none';
          }

          resultsArea.style.display = 'block';
          progressText.textContent = `[${i+1}/${targets.length}] ${target} — done`;
        } catch (err) {
          showError(`[${target}] ${err.message}`);
          running = false;
          runBtn.disabled = false;
          progressArea.style.display = 'none';
          return;
        }
      }

      running = false;
      runBtn.disabled = false;
      progressBar.value = 100;
      progressText.textContent = 'All targets complete.';
    });

    // ── Open PDF ──────────────────────────────────────────────
    openPdfBtn.addEventListener('click', () => {
      if (currentPdfPath) window.api.openPdf(currentPdfPath);
    });
  })();
</script>
</body>
</html>
