<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brimer-PLAST</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="header-row">
    <h1>Brimer-PLAST</h1>
    <button id="theme-toggle" title="Toggle dark/light theme">☀️</button>
  </div>

  <!-- File pickers (global) -->
  <label class="global-file-label">Genome FASTA</label>
  <div class="file-row">
    <button id="genome-btn">Browse…</button>
    <span class="path" id="genome-path">No file selected</span>
  </div>

  <label class="global-file-label">GTF Annotation</label>
  <div class="file-row">
    <button id="gtf-btn">Browse…</button>
    <span class="path" id="gtf-path">No file selected</span>
  </div>

  <!-- Target table -->
  <table id="targets-table">
    <colgroup>
      <col class="col-target">
      <col class="col-name">
      <col class="col-params">
      <col class="col-results">
    </colgroup>
    <thead>
      <tr>
        <th>Target</th>
        <th>Name</th>
        <th>Params</th>
        <th>Results</th>
      </tr>
    </thead>
    <tbody id="targets-body"></tbody>
  </table>

  <!-- PDF opener fallback (if no result-link is visible) -->
  <div id="global-pdf-area">
    <a id="global-pdf-link" href="#">Open PDF report</a>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
